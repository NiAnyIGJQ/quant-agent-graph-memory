[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-ace"
version = "0.1.0"
description = "BTC Quant Trading System with Multi-Agent Architecture"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "BTC ACE Team" }
]
dependencies = [
    # Core Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Trading Framework
    "backtrader>=1.9.0",

    # Visualization
    "matplotlib>=3.7.0",

    # LLM Framework
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchainhub>=0.1.0",

    # HTTP Utilities
    "httpx-sse>=0.4.0",

    # Data Validation
    "pydantic>=2.0.0",

    # Deep Learning
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",

    # Graph Database
    "neo4j>=5.0.0",

    # Utilities
    "tqdm>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ace_trading"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
